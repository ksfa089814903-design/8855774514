services:
  - type: web
    name: activity-booking
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CENTER_NAME
        value: 休閒中心
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DB_FILE
        value: /var/data/activity.sqlite
    disk:
      name: activity-data
      mountPath: /var/data
      sizeGB: 5
